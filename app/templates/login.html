<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统登录</title>
    <style>
        .box {
            width: 300px;
            margin: 100px auto;
        }

        div {
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>物资管理系统登录</h2>
    <form method="post">
        <div>账号：<input type="text" name="username" required></div>
        <div>密码：<input type="password" name="password" required></div>
        <div>
            <button type="submit">登录</button>
        </div>
    </form>
</div>
</body>
</html>
