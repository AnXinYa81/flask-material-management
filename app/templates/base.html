<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            font-family: Microsoft YaHei, sans‑serif;
        }
        /* 全局导航栏 */
        .nav-bar {
            background:#2c3e50;
            padding:12px 16px;
            margin-bottom:24px;
        }
        .nav-bar a {
            color:#fff;
            margin-right:18px;
            text-decoration:none;
        }
        .nav-bar a:hover {
            text-decoration: underline;
        }
        table{
            border-collapse: collapse;
            width:100%;
        }
        th,td{
            border:1px solid #999;
            padding:8px 10px;
        }
        th{
            background-color:#f2f2f2;
        }
        button,input,select,textarea{
            padding:6px;
            margin:4px 0;
        }
        .tip-error{
            color:#c0392b;
        }
        .tip-success{
            color:#27ae60;
        }
    </style>
</head>
<body>
    <!--公共导航栏-->
    <div class="nav-bar">
        <a href="{{ url_for('goods.goods_list') }}">物资列表</a>
        <a href="{{ url_for('goods.goods_add') }}">新增物资</a>
        <a href="{{ url_for('record.record_add') }}">领用登记</a>
        <a href="{{ url_for('record.record_list') }}">领用流水</a>
    </div>

    {% block content %}{% endblock %}
</body>
</html>
