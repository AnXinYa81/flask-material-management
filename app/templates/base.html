<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}物资管理系统{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .nav-bar {
            background: #2c3e50;
            padding: 14px 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-bar .brand {
            color: #fff;
            font-weight: 600;
            font-size: 17px;
            margin-right: 30px;
            letter-spacing: 1px;
        }

        .nav-bar a {
            color: #bdc3c7;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-bar a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        h2 {
            color: #2c3e50;
            border-left: 4px solid #3498db;
            padding-left: 12px;
            margin-bottom: 20px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
            font-size: 14px;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        button, .btn {
            display: inline-block;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.2s;
        }

        button[type="submit"] {
            background: #3498db;
            color: #fff;
        }

        button[type="submit"]:hover {
            background: #2980b9;
        }

        .btn-del {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-del:hover {
            background: #c0392b;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            margin: 4px 0 14px;
            transition: border 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        label {
            display: block;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            margin-top: 8px;
        }

        .tip-error {
            color: #c0392b;
            background: #fdecea;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin: 10px 0;
        }

        .tip-success {
            color: #27ae60;
            background: #eafaf1;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin: 10px 0;
        }

        .role-tag {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .role-super {
            background: #f39c12;
            color: #fff;
        }

        .role-admin {
            background: #3498db;
            color: #fff;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c3e50, #3498db);
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <span class="brand">📦 物资管理系统</span>
        <a href="{{ url_for('goods.goods_list') }}">物资列表</a>
        <a href="{{ url_for('goods.goods_add') }}">新增物资</a>
        <a href="{{ url_for('record.record_add') }}">领用登记</a>
        <a href="{{ url_for('record.record_list') }}">领用流水</a>
        <a href="{{ url_for('auth.admin_list') }}">管理员管理</a>
    </div>

    <div class="container">
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
